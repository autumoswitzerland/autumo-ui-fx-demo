/**
 *
 * JavaFX build-script for autumo UI FX Demo.
 * Version: 1.0
 *
 * 2026 autumo GmbH
 * Date: 31.10.2026
 *
 */

plugins {
    id 'eclipse'
    id 'com.gradleup.shadow' version '9.6.1'
    id 'org.beryx.runtime' version '2.0.1'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

javafx {
    version = "25"
    modules = [ 'javafx.controls', 'javafx.fxml', 'javafx.web', 'javafx.swing' ]
}
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
        vendor = JvmVendorSpec.AZUL
        // Azul Zulu is the JDK of choice; the foojay resolver (settings.gradle)
        // auto-provisions a Zulu JDK when no local Zulu 25 is found.
	}
}

eclipse {
    project {
        name = 'autumo-ui-fx-demo'
    }
}

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java']
        }
        resources {
            srcDirs = ['src/main/resources']
        }
    }
}

jar {
    version = '1.2.0'
}

// Standalone fat jar: excludes the JavaFX/JDK classes the packaged runtime provides.
shadowJar {
    exclude 'javax/**'
    exclude 'javafx/**'
    exclude 'com/sun/**'
    exclude '*.dylib'
}

repositories {
    // Vendored framework (autumo-ui-fx is not published to Maven Central):
    // the jar + its Gradle module metadata live in lib/ (maven layout).
    maven { url = uri("$rootDir/lib") }
	mavenLocal()
    mavenCentral()
}

dependencies {
    implementation "ch.autumo.commons:autumo-ui-fx:1.2.0"
	
	implementation "org.apache.logging.log4j:log4j-api:2.26.1"
	implementation "org.apache.logging.log4j:log4j-core:2.26.1"
	implementation "org.apache.logging.log4j:log4j-slf4j2-impl:2.26.1"

    // JSON pretty-printing for the JSON formatter pane.
    implementation 'com.google.code.gson:gson:2.11.0'
    
	implementation 'org.apache.commons:commons-lang3:3.21.0'
	implementation "net.synedra:validatorfx:1.0.0"
}

application {
    mainClass = 'ch.autumo.ui.demo.App'
}

// Allow JavaFX native access, required for interoperability with Swing/AWT on modern JDKs.
tasks.named('run') {
    jvmArgs '--enable-native-access=javafx.graphics'
}

// Standalone fat jar: excludes the JavaFX/JDK classes the packaged runtime provides.
shadowJar {
    exclude 'javax/**'
    exclude 'javafx/**'
    exclude 'com/sun/**'
    exclude '*.dylib'
}

def runtimeJdk = 'zulu25.36.205-ca-fx-jdk25.0.4.1'

// Returns the configured local JDK if it exists (developer machines) and otherwise the JDK of
// the Java toolchain. The toolchain JDK is also the one whose jlink creates the runtime image,
// so both sides always share the same java.base version. Falling back to java.home is wrong:
// the JVM that runs Gradle may be a different major version than the toolchain, which makes
// jlink fail with "jlink version X does not match target java.base version Y".
def jdkHomeFor(String path) {
    return providers.provider {
        if (new File(path).exists()) {
            return path
        }
        return javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(25)
            vendor = JvmVendorSpec.AZUL
        }.get().metadata.installationPath.asFile.absolutePath
    }
}

// jpackage copies only a fixed set of files into the temporary WiX config directory it uses as
// WiX base path ('light.exe -b <configDir>'): main.wxs, overrides.wxi, msica.dll, the *.wxl
// files and its own dialog sources. Everything else from '--resource-dir' is ignored.
// The image/license references in package/main.wxs ('$(var.JpRootDir)/package/...') are
// relative, so they resolve to nothing and light.exe aborts with LGHT0103 - 'exited with 103
// code'. The Windows installer therefore gets a generated main.wxs with absolute paths.
def wixPackageDir = file('package')
def wixResourceDir = layout.buildDirectory.dir('wix-resources')

def prepareWixResources = tasks.register('prepareWixResources') {
    def sourceWxs = new File(wixPackageDir, 'main.wxs')
    // WiX accepts forward slashes on Windows; backslashes are not escaped in XML attributes.
    def packagePath = wixPackageDir.absolutePath.replace('\\', '/')
    inputs.file(sourceWxs)
    outputs.dir(wixResourceDir)
    doLast {
        File target = wixResourceDir.get().file('main.wxs').asFile
        target.parentFile.mkdirs()
        target.text = sourceWxs.getText('UTF-8')
                .replace('$(var.JpRootDir)/package/', packagePath + '/')
    }
}

runtime {
    modules = ['javafx.controls', 'javafx.fxml', 'javafx.web', 'javafx.swing']

    // jpackage accepts one to three dot-separated integers as the application version, so the
    // development version's '-SNAPSHOT' qualifier (3.0.0-SNAPSHOT) is stripped for the installer.
    // The project version itself stays untouched.
    def installerVersion = project.version.toString().replaceFirst(/(?i)-.*$/, '')

    jpackage {
        options = [
            '--strip-debug',
            // 'zip-6' replaces the deprecated numeric '--compress 2' (JDK 21+).
            '--compress', 'zip-6',
            '--no-header-files',
            '--no-man-pages'
        ]

        // The plugin derives --app-version from project.version (3.0.0-SNAPSHOT), which jpackage
        // rejects. Override it with the sanitized, numeric installer version (see above).
        appVersion = installerVersion

        def workflowTarget = (project.findProperty('targetPlatform') ?: 'macos-x64').toString()
        def beryxTarget
        switch (workflowTarget) {
            case 'macos-x64':
                beryxTarget = 'mac'
                break
            case 'macos-arm64':
                beryxTarget = 'macArch'
                break
            case 'windows-x64':
                beryxTarget = 'win'
                break
            case 'linux-x64':
                beryxTarget = 'linux'
                break
            default:
                throw new GradleException("Unknown targetPlatform: ${workflowTarget}")
        }
        targetPlatformName = beryxTarget
                
        imageName = 'autumo UI FX Demo'
        // 'jvmArgs' intentionally not set: the former '-Djdk.gtk.version=2' is pointless since
        // JavaFX 25 dropped GTK 2 and only printed a warning about it.
        // The packaging resources (license texts, icons, WiX templates) live in the project's
        // 'package/' directory.
        resourceDir = file('package')

        installerOptions = [
            '--description', 'autumo UI FX Demo',
            '--copyright', 'Copyright 2026 autumo GmbH',
            '--vendor', 'autumo GmbH'
        ]

        if (targetPlatformName == 'macArch') {
            targetPlatform('macArch') {
                jdkHome = jdkHomeFor('/Volumes/Fastdrive/Development/JDKs/Azul/mac/' +
                        runtimeJdk + '-macosx_aarch64/Contents/Home')
            }
            installerType = 'pkg'
            installerOptions += ['--name', 'autumo-UI-FX-Demo-arm64']
            installerOptions += ['--mac-app-category', 'Development']
        }

        if (targetPlatformName == 'mac') {
            targetPlatform('mac') {
                jdkHome = jdkHomeFor('/Volumes/Fastdrive/Development/JDKs/Azul/mac/' +
                        runtimeJdk + '-macosx_x64/Contents/Home')
            }
            installerType = 'pkg'
            installerOptions += ['--name', 'autumo-UI-FX-Demo-x64']
            installerOptions += ['--license-file', file('package/LICENSE.txt').absolutePath]
            installerOptions += ['--mac-app-category', 'Development']
        }

        if (targetPlatformName == 'win') {
            targetPlatform('win') {
                jdkHome = jdkHomeFor('G:/Java/JDKs/Azul/' + runtimeJdk + '-win_x64')
            }
            // See prepareWixResources: WiX needs absolute paths for banner, dialog and license.
            resourceDir = wixResourceDir.get().asFile
            installerType = 'exe'
            installerOptions += ['--name', 'autumo-UI-FX-Demo']
        }

        if (targetPlatformName == 'linux') {
            // jpackage silently derives 'Depends' from the build host when the custom control
            // file is missing, which produces a package that cannot be installed on other
            // distributions. Fail here instead of shipping such a package.
            if (!file('package/control').isFile()) {
                throw new GradleException("package/control is missing. Without it jpackage derives " +
                        "the Debian 'Depends' field from the build host and the package becomes " +
                        "uninstallable on Debian/Ubuntu systems with other package names.")
            }
            targetPlatform('linux') {
                jdkHome = jdkHomeFor('/opt/java/' + runtimeJdk + '-linux_amd64')
            }
            installerType = 'deb'
            installerOptions += ['--name', 'autumo-UI-FX-Demo']
            installerOptions += ['--linux-app-category', 'Development']
            installerOptions += ['--linux-deb-maintainer', 'info@autumo.ch']
            // 'package/control' (in the resource directory) overrides the 'Depends' field that
            // jpackage would derive on its own: jpackage runs 'ldd' over the app image and asks
            // the build host's package database ('dpkg -S') for the providing packages. That
            // yields build-host package names (e.g. 'libglycin-2-0' from a recent Ubuntu), which
            // do not exist on Debian and make the package uninstallable. The custom control file
            // therefore lists the runtime libraries explicitly, with 'a | b' alternatives for
            // the packages whose names differ between Debian and Ubuntu.
        }

        if (installerType == 'pkg') {
            imageOptions += ['--icon', 'src/main/resources/icon.icns']
            // Bundle identifier of the application itself (Info.plist), not of the installer.
            imageOptions += ['--mac-package-identifier', 'ch.autumo.ui.demo']
        }

        if (installerType == 'exe') {
            imageOptions += ['--icon', 'src/main/resources/icon.ico']
            installerOptions += [
                '--win-dir-chooser',
                '--win-menu',
                '--win-shortcut'
            ]
        }

        if (installerType in ['deb', 'rpm']) {
            imageOptions += ['--icon', 'src/main/resources/icon_256x256.png']
            installerOptions += [
                '--resource-dir', 'build/jpackage/autumo UI FX Demo/lib',
                '--license-file', 'package/LICENSE.txt',
                '--linux-menu-group', 'Utility',
                '--linux-shortcut'
            ]
        }

        if (installerType == 'rpm') {
            installerOptions += [
                '--linux-rpm-license-type', 'GPLv3'
            ]
        }
    }
}

// ':ui:jpackageImage' consumes the jlink image that ':ui:runtime' produces (build/jre). Gradle 9
// rejects that as an implicit dependency, so declare it explicitly.
// The generated WiX resources must exist as well: 'resourceDir' is a declared input of
// ':jpackageImage' (and of ':jpackage').
tasks.named('jpackageImage') {
    dependsOn tasks.named('runtime')
    dependsOn prepareWixResources
}

// ':jpackage' reads 'main.wxs' from the resource directory, so the generated copy must exist
// before the installer is built.
tasks.named('jpackage') {
    dependsOn prepareWixResources
}

// The 'Depends' field of the .deb must be identical on every build host. jpackage derives it
// from the build machine ('ldd' + 'dpkg -S'), which yields package names that exist only on the
// build host's distribution (e.g. 'libglycin-2-0' from a recent Ubuntu). The custom template
// 'package/control' (picked up from the resource directory) did not take effect on the build
// runner, so the field is set explicitly on the built package. 'package/control' stays the single
// source of truth; if jpackage ever honours it, the values already match and nothing changes.
def patchDebianDependencies = tasks.register('patchDebianDependencies') {
    def debDir = layout.buildDirectory.dir('jpackage')
    def controlFile = file('package/control')
    def isLinux = System.getProperty('os.name').toLowerCase().contains('linux')
    outputs.upToDateWhen { false }
    onlyIf {
        // Only after a successful installer build, and only where jpackage can build a .deb.
        isLinux && tasks.named('jpackage').get().state.failure == null
    }
    doLast {
        if (!controlFile.isFile()) {
            throw new GradleException("package/control is missing.")
        }
        String depends = controlFile.readLines('UTF-8').find { it.startsWith('Depends:') }
        if (!depends) {
            throw new GradleException("package/control has no 'Depends:' line.")
        }
        List<File> debs = (debDir.get().asFile.listFiles() ?: []).findAll { it.name.endsWith('.deb') }
        debs.each { File deb ->
            File work = new File(temporaryDir, deb.name).tap { deleteDir(); mkdirs() }
            runTool(['dpkg-deb', '-R', deb.absolutePath, work.absolutePath])
            File control = new File(work, 'DEBIAN/control')
            List<String> lines = control.readLines('UTF-8')
            int index = lines.findIndexOf { it.startsWith('Depends:') }
            if (index < 0) {
                lines << depends
            } else if (lines[index] != depends) {
                logger.lifecycle("Replacing build-host dependencies in ${deb.name}")
                logger.lifecycle("  was: ${lines[index]}")
                lines[index] = depends
                logger.lifecycle("  now: ${depends}")
            }
            control.setText(lines.join('\n') + '\n', 'UTF-8')
            runTool(['dpkg-deb', '--root-owner-group', '-b', work.absolutePath, deb.absolutePath])
        }
    }
}

tasks.named('jpackage') {
    finalizedBy patchDebianDependencies
}

void runTool(List<String> command) {
    Process process = new ProcessBuilder(command).redirectErrorStream(true).start()
    String output = process.inputStream.text
    if (process.waitFor() != 0) {
        throw new GradleException("Command failed: ${command.join(' ')}\n${output}")
    }
}
