plugins {
    id 'eclipse'
    id 'com.gradleup.shadow' version '9.6.1'
    id 'org.beryx.runtime' version '2.0.1'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

javafx {
    version = "25"
    modules = [ 'javafx.controls', 'javafx.fxml', 'javafx.web', 'javafx.swing' ]
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
        vendor = JvmVendorSpec.AZUL
    }
}

eclipse {
    project {
        name = 'autumo-ui-fx-demo'
    }
}

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java']
        }
        resources {
            srcDirs = ['src/main/resources']
        }
    }
}

jar {
    version = '1.2.0'
}

shadowJar {
    exclude 'javax/**'
    exclude 'javafx/**'
    exclude 'com/sun/**'
    exclude '*.dylib'
}

repositories {
    maven { url = uri("$rootDir/lib") }
    mavenLocal()
    mavenCentral()
}

dependencies {
    implementation "org.openjfx:javafx-controls:25"
    implementation "org.openjfx:javafx-fxml:25"
    implementation "org.openjfx:javafx-web:25"
    implementation "org.openjfx:javafx-swing:25"
    implementation "ch.autumo.commons:autumo-ui-fx:1.2.0"
    implementation "net.synedra:validatorfx:1.0.0"
    implementation "org.apache.logging.log4j:log4j-api:2.26.1"
    implementation "org.apache.logging.log4j:log4j-core:2.26.1"
    implementation "org.apache.logging.log4j:log4j-slf4j2-impl:2.26.1"
    implementation 'org.apache.commons:commons-lang3:3.21.0'
    implementation 'com.google.code.gson:gson:2.11.0'
}

application {
    mainClass = 'ch.autumo.ui.demo.App'
}

tasks.named('run') {
    jvmArgs '--enable-native-access=javafx.graphics'
}

def runtimeJdk = 'zulu25.36.205-ca-fx-jdk25.0.4.1'

def jdkHomeFor(String path) {
    return providers.provider {
        if (new File(path).exists()) {
            return path
        }
        return javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(25)
            vendor = JvmVendorSpec.AZUL
        }.get().metadata.installationPath.asFile.absolutePath
    }
}

def wixPackageDir = file('package')
def wixResourceDir = layout.buildDirectory.dir('wix-resources')

def prepareWixResources = tasks.register('prepareWixResources') {
    def sourceWxs = new File(wixPackageDir, 'main.wxs')
    def packagePath = wixPackageDir.absolutePath.replace('\\', '/')
    inputs.file(sourceWxs)
    outputs.dir(wixResourceDir)
    doLast {
        File target = wixResourceDir.get().file('main.wxs').asFile
        target.parentFile.mkdirs()
        target.text = sourceWxs.getText('UTF-8')
            .replace('$(var.JpRootDir)/package/', packagePath + '/')
    }
}

runtime {
    modules = ['javafx.controls', 'javafx.fxml', 'javafx.web', 'javafx.swing']

    def installerVersion = project.version.toString().replaceFirst(/(?i)-.*$/, '')

    jpackage {
        options = [
            '--strip-debug',
            '--compress', 'zip-6',
            '--no-header-files',
            '--no-man-pages'
        ]

        appVersion = installerVersion

        def workflowTarget = (project.findProperty('targetPlatform') ?: 'macos-x64').toString()
        def beryxTarget
        switch (workflowTarget) {
            case 'macos-x64':
                beryxTarget = 'mac'
                break
            case 'macos-arm64':
                beryxTarget = 'macArch'
                break
            case 'windows-x64':
                beryxTarget = 'win'
                break
            case 'linux-x64':
                beryxTarget = 'linux'
                break
            default:
                throw new GradleException("Unknown targetPlatform: ${workflowTarget}")
        }
        targetPlatformName = beryxTarget
        imageName = 'autumo UI FX Demo'
        resourceDir = file('package')

        installerOptions = [
            '--description', 'autumo UI FX Demo',
            '--copyright', 'Copyright 2026 autumo GmbH',
            '--vendor', 'autumo GmbH'
        ]

        if (workflowTarget == 'macos-arm64') {
            targetPlatform('macArch') {
                jdkHome = jdkHomeFor('/Volumes/Fastdrive/Development/JDKs/Azul/mac/' +
                        runtimeJdk + '-macosx_aarch64/Contents/Home')
            }
            installerType = 'pkg'
            installerOptions += ['--name', 'autumo-UI-FX-Demo-arm64']
            installerOptions += ['--mac-app-category', 'Development']
        }

        if (workflowTarget == 'macos-x64') {
            targetPlatform('mac') {
                jdkHome = jdkHomeFor('/Volumes/Fastdrive/Development/JDKs/Azul/mac/' +
                        runtimeJdk + '-macosx_x64/Contents/Home')
            }
            installerType = 'pkg'
            installerOptions += ['--name', 'autumo-UI-FX-Demo-x64']
            installerOptions += ['--license-file', file('package/LICENSE.txt').absolutePath]
            installerOptions += ['--mac-app-category', 'Development']
        }

        if (workflowTarget == 'windows-x64') {
            targetPlatform('win') {
                jdkHome = jdkHomeFor('G:/Java/JDKs/Azul/' + runtimeJdk + '-win_x64')
            }
            resourceDir = wixResourceDir.get().asFile
            installerType = 'exe'
            installerOptions += ['--name', 'autumo-UI-FX-Demo-x64']
        }

        if (workflowTarget == 'linux-x64') {
            if (!file('package/control').isFile()) {
                throw new GradleException("package/control is missing. Without it jpackage derives " +
                        "the Debian 'Depends' field from the build host and the package becomes " +
                        "uninstallable on Debian/Ubuntu systems with other package names.")
            }
            targetPlatform(beryxTarget) {
                jdkHome = jdkHomeFor('/opt/java/' + runtimeJdk + '-linux_amd64')
            }
            installerType = 'deb'
            installerOptions += ['--name', 'autumo-UI-FX-Demo-x64']
            installerOptions += ['--linux-app-category', 'Development']
            installerOptions += ['--linux-deb-maintainer', 'info@autumo.ch']
        }
    }
}

tasks.named('jpackageImage') {
    dependsOn tasks.named('runtime')
    dependsOn prepareWixResources
}

def patchDebianDependencies = tasks.register('patchDebianDependencies') {
    def debDir = layout.buildDirectory.dir('jpackage')
    def controlFile = file('package/control')
    def isLinux = System.getProperty('os.name').toLowerCase().contains('linux')
    outputs.upToDateWhen { false }
    onlyIf {
        isLinux && tasks.named('jpackage').get().state.failure == null
    }
    doLast {
        if (!controlFile.isFile()) {
            throw new GradleException("package/control is missing.")
        }
        String depends = controlFile.readLines('UTF-8').find { it.startsWith('Depends:') }
        if (!depends) {
            throw new GradleException("package/control has no 'Depends:' line.")
        }
        List<File> debs = (debDir.get().asFile.listFiles() ?: []).findAll { it.name.endsWith('.deb') }
        debs.each { File deb ->
            File work = new File(temporaryDir, deb.name).tap { deleteDir(); mkdirs() }
            runTool(['dpkg-deb', '-R', deb.absolutePath, work.absolutePath])
            File control = new File(work, 'DEBIAN/control')
            List<String> lines = control.readLines('UTF-8')
            int index = lines.findIndexOf { it.startsWith('Depends:') }
            if (index < 0) {
                lines << depends
            } else if (lines[index] != depends) {
                logger.lifecycle("Replacing build-host dependencies in ${deb.name}")
                logger.lifecycle("  was: ${lines[index]}")
                lines[index] = depends
            }
            control.setText(lines.join('\n') + '\n', 'UTF-8')
            runTool(['dpkg-deb', '--root-owner-group', '-b', work.absolutePath, deb.absolutePath])
        }
    }
}

tasks.named('jpackage') {
    dependsOn prepareWixResources
    finalizedBy patchDebianDependencies
}

void runTool(List<String> command) {
    Process process = new ProcessBuilder(command).redirectErrorStream(true).start()
    String output = process.inputStream.text
    if (process.waitFor() != 0) {
        throw new GradleException("Command failed: ${command.join(' ')}\n${output}")
    }
}
