#
# The license runtime type; this value can be configured within the product 
# variants in the autumo registration server application. If no variants are
# defined then the value 'Standard' should be used and no other license type
# is being evaluated with variants when purchasing a product with PayPal.
#
# A variant is identified by the PayPal item code if this product is purchased
# through PayPal, e.g. 'DM999-88'; it is the value behind the hyphen, in this
# case '88'. This value is the 'identifier' in the product variant
# configuration.
#
# The lincense type value is also stored within the license, manually created
# or created by the PayPal purchase notification process. Every license check
# through code or the registration process, e.g. with 'bin/register.sh|bat',
# checks this value! It can be any value without spaces, unless there are no
# variants, then it has to be 'Standard'!
#
lc_type=hibs8zeh9oiwdfijei0


#
# The runtime type. It is used to check if this product can be run for a
# limited time or for an unlimited time.
#
# Format: <rtType>:<date>:<internalSecKey>
# 
# - rtType:          The value 'unlimited' or amount of days it can be run.
# - date:            If 'rtType' holds a number, a date in the past must be 
#                    defined 'dd.MM.yyyy'. If it holds the value 'unlimited'
#                    use a date in far future, e.g. '01.01.2199'.
# - internalSecKey:  Must match the internal security key.	
# 
rt_type=unlimited:01.01.2199:8c7b9350e319f89d2fa5085409872592


#
# The product key must match the product key defined in the registration
# object within the autumo registration server application that is assigned
# to the corresponding product. There might be several registartion versions
# for onbe product, but the key should never change!
#
# Registrations (registrationversions) are used to determine if a newer
# product version ist still valid to be licensed with a certain basic
# registration version. If the registration version changes, the license
# gets invalid for a product!
#
prod_key=398742fcbs78ds9s


#
# License inline checks. The lincense handler provides the inline checks
# configured here. They are not applied, unless manually implemented, but
# a valid configuration must be provided! 
#
# Format: <internalSecKey>,oc:yes|no,mc:yes|no,<mac-address>,gpc:yes|no
#
# - internalSecKey:  Must match the internal security key.
# - oc:              Online check? 'yes' or 'no'.
# - mc:              Mac address check? 'yes' or 'no'.
# - mac-address:     The mac address of the hardware this application is
#                    running on. If the 'mc:no' (no mac address check), the
#                    value '00-00-00-00-00-00' can be used.
# - gpc:             Global processing check? 'yes' or 'no'.
#                    Can be used for checking processing ressources
#                    Processors / Cores, etc.
#
ic=8c7b9350e319f89d2fa5085409872592,oc:no,mc:no:00-00-00-00-00-00,gpc:no


#
# The autumo registration server API key.
#
ap_ls_ak=abcdabcdabcdabcdabcdabcdabcdabcd


#
# The autumo registration server license check URL address.
#
ap_ls_ad=https://products.autumo.ch/licenses/securecheck


#
# Public key for license server.
#
license_public_key=
