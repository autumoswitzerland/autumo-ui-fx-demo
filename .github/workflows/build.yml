name: Build

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (optional, e.g. v1.2.0). Leave empty to only build.'
        required: false
        default: ''

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-13
            target: mac
          - os: macos-latest
            target: macArch
          - os: windows-latest
            target: win
          - os: ubuntu-latest
            target: linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java (Azul Zulu 25 + JavaFX)
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '25'
          java-package: 'jdk+fx'

      - name: Install WiX Toolset (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install wixtoolset -y
          # jpackage looks up candle.exe/light.exe on PATH. The install updates the
          # machine PATH, which the already running runner process does not see, so
          # the WiX bin directory is exported to the following steps explicitly.
          $wix = Get-ChildItem 'C:\Program Files (x86)\WiX Toolset*' -Directory -ErrorAction SilentlyContinue |
            Sort-Object Name -Descending | Select-Object -First 1
          if ($wix) { "$($wix.FullName)\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append }

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build installer
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew jpackage -PtargetPlatform=${{ matrix.target }} --no-daemon

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: autumo-ui-fx-demo-${{ matrix.target }}
          path: |
            build/jpackage/*.pkg
            build/jpackage/*.dmg
            build/jpackage/*.exe
            build/jpackage/*.deb
            build/jpackage/*.rpm
          if-no-files-found: warn

  release:
    name: Create GitHub Release
    needs: build
    if: inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: autumo-ui-fx-demo-*
          merge-multiple: true

      - name: List assets
        shell: bash
        run: find release-assets -type f

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          files: release-assets/*
          draft: false
          prerelease: false
          body: |
            ## autumo UI FX Demo ${{ inputs.tag }}

            Native installers for macOS (x64/arm64), Windows and Linux.
            The installer packages are attached below as release assets.
            The Java runtime is bundled, no separate Java installation is required.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
