name: Build

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (optional, e.g. v1.2.0). Leave empty to only build.'
        required: false
        default: ''

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            target: mac
          - os: macos-latest
            target: macArch
          - os: windows-latest
            target: win
          - os: ubuntu-latest
            target: linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java (Azul Zulu 25 + JavaFX)
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '25'
          java-package: 'jdk+fx'

      - name: Install WiX Toolset (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install wixtoolset -y
          # jpackage looks up candle.exe/light.exe on PATH. The install updates the
          # machine PATH, which the already running runner process does not see, so
          # the WiX bin directory is exported to the following steps explicitly.
          $wix = Get-ChildItem 'C:\Program Files (x86)\WiX Toolset*' -Directory -ErrorAction SilentlyContinue |
            Sort-Object Name -Descending | Select-Object -First 1
          if ($wix) { "$($wix.FullName)\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append }

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build installer
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew jpackage -PtargetPlatform=${{ matrix.target }} --no-daemon

      - name: Verify Debian dependencies (Linux)
        if: matrix.target == 'linux'
        shell: bash
        run: |
          # The package must carry the Depends line from package/control, not one derived from
          # the build host's package database.
          expected=$(grep -m1 '^Depends:' package/control)
          for deb in build/jpackage/*.deb; do
            echo "== $deb"
            actual="Depends: $(dpkg-deb -f "$deb" Depends)"
            echo "$actual"
            if [ "$actual" != "$expected" ]; then
              echo "::error::$deb does not carry the Depends line of package/control"
              exit 1
            fi
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: autumo-ui-fx-demo-${{ matrix.target }}
          path: |
            build/jpackage/*.pkg
            build/jpackage/*.dmg
            build/jpackage/*.exe
            build/jpackage/*.deb
            build/jpackage/*.rpm
          if-no-files-found: warn

  # The .deb must install on Debian and Ubuntu alike. jpackage would derive the 'Depends' field
  # on the build host; the package therefore carries its own list (package/control). This job
  # proves that list: it installs the package in a plain container of each distribution and
  # verifies that every shared library of the installed application resolves.
  linux-install-check:
    name: Install check (${{ matrix.image }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: 'debian:trixie'
          - image: 'ubuntu:24.04'
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: autumo-ui-fx-demo-linux
          path: pkg

      - name: Install in ${{ matrix.image }} and verify libraries
        shell: bash
        run: |
          cat > check.sh <<'EOF'
          set -euo pipefail
          apt-get update -qq
          # A bare container has none of the XDG directories that every desktop system provides.
          # jpackage's postinst calls 'xdg-desktop-menu' and 'xdg-icon-resource', which require a
          # writable system menu directory and a writable system icon directory and abort the
          # package configuration otherwise (exit code 3).
          mkdir -p /usr/share/applications /usr/share/desktop-directories /usr/share/icons
          apt-get install -y -qq --no-install-recommends ./pkg/*.deb
          # Install directory as recorded by dpkg, so a renamed package cannot make this vacuous.
          app=$(dpkg -L autumo-ui-fx-demo | awk -F/ '/^\/opt\// {print "/" $2 "/" $3}' | sort -u | head -n 1)
          if [ -z "$app" ] || [ ! -d "$app" ]; then
            echo "::error::Application directory not found in the installed package"
            exit 1
          fi
          echo "Application directory: $app ($(find "$app" -type f | wc -l) files)"
          status=0
          while IFS= read -r file; do
            if ldd "$file" 2>/dev/null | grep -q 'not found'; then
              echo "::error::Unresolved libraries for $file"
              ldd "$file" | grep 'not found'
              status=1
            fi
          done < <(find "$app" -type f \( -name '*.so' -o -name '*.so.*' -o -perm -u+x \))
          if [ "$status" -ne 0 ]; then
            echo "The Depends list in package/control is incomplete."
            exit 1
          fi
          echo "All shared libraries resolve."
          EOF
          docker run --rm -v "$PWD/pkg:/pkg:ro" -v "$PWD/check.sh:/check.sh:ro" \
            "${{ matrix.image }}" bash /check.sh

  release:
    name: Create GitHub Release
    needs: build
    if: inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: autumo-ui-fx-demo-*
          merge-multiple: true

      - name: List assets
        shell: bash
        run: find release-assets -type f

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          files: release-assets/*
          draft: false
          prerelease: false
          body: |
            ## autumo UI FX Demo ${{ inputs.tag }}

            Native installers for macOS (x64/arm64), Windows and Linux.
            The installer packages are attached below as release assets.
            The Java runtime is bundled, no separate Java installation is required.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
